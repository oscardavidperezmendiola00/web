<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto</title>
    <link rel="stylesheet" href="estilo.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        function initMap() {
            var location = [19.432608, -99.133209];
            var map = L.map('map').setView(location, 15);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
            
            L.marker(location).addTo(map).bindPopup("Ubicación de nuestra tienda").openPopup();
        }
    </script>
    <link rel="icon" type="image/x-icon" href="/image/icono.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body onload="initMap()">
    <header>
        <nav>
            <a href="index.html">Inicio</a>
        </nav>
    </header>

    <div class="encabezado-img">
        <p><strong>Contactos</strong></p>
        <span class="h1 text-uppercase  bg-dark px-5" style="color: white; font-size: 50px;" >Players</span>
        <p><strong>Lo primero y último en videojuegos</strong></p>
    </div>

    <div class="contacto-container">
        <h2>📍 Nuestra Ubicación</h2>
        <div id="map"></div>

        <h2>📩 Contáctanos</h2>
        <p>Para más información, envíanos un correo o síguenos en redes sociales.</p>
        
        <div class="contact-buttons">
            <a href="mailto:oscar.pmendiola@gmail.com" class="email-btn">✉️ Enviar Correo</a>
            <div class="social-icons">
                <a href="https://facebook.com" target="_blank" class="social-btn facebook">Facebook</a>
                <a href="https://twitter.com" target="_blank" class="social-btn twitter">Twitter</a>
                <a href="https://instagram.com" target="_blank" class="social-btn instagram">Instagram</a>
            </div>
        </div>

        <h2>📝 Encuesta de Satisfacción</h2>
        <form>
            <label for="satisfaccion">¿Qué tan satisfecho estás con nuestro servicio?</label><br>
            <select id="satisfaccion" name="satisfaccion">
                <option value="1">1 - Muy insatisfecho</option>
                <option value="2">2 - Insatisfecho</option>
                <option value="3">3 - Regular</option>
                <option value="4">4 - Satisfecho</option>
                <option value="5">5 - Muy satisfecho</option>
            </select>
            <br><br>
            <button type="submit">Enviar</button>
        </form>
    </div>
</body>
</html>
